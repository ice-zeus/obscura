[package]
name = "obscura-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Opt in to real ANGLE graphics; default feature sets remain unchanged.
webgl = ["render", "obscura-browser/webgl"]
default = []
stealth = ["obscura-browser/stealth", "obscura-net/stealth"]
render = ["obscura-browser/render", "dep:base64"]

[dependencies]
obscura-browser = { workspace = true }
obscura-dom = { workspace = true }
obscura-net = { workspace = true }
tokio = { workspace = true }
url = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
base64 = { workspace = true, optional = true }
